<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="wind1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wind2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wind3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0"/>
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#sky)"/>

  <!-- Mountain (summit) -->
  <polygon points="256,120 380,340 132,340" fill="url(#peak)"/>
  <!-- Mountain shadow face -->
  <polygon points="256,120 380,340 256,340" fill="#64748b" opacity="0.5"/>

  <!-- Snow cap -->
  <polygon points="256,120 230,170 282,170" fill="#f8fafc"/>
  <polygon points="230,170 220,190 256,185 290,190 282,170" fill="#e2e8f0"/>

  <!-- Wind streaks (breeze) — three curved lines flowing past the peak -->
  <path d="M 70,190 Q 200,170 340,200" stroke="url(#wind1)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 50,230 Q 190,200 370,238" stroke="url(#wind2)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 90,265 Q 220,240 390,270" stroke="url(#wind3)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Subtle code brackets: ( ) hinting at s-expressions -->
  <text x="148" y="400" font-family="monospace" font-size="56" font-weight="bold" fill="#38bdf8" opacity="0.7">(</text>
  <text x="330" y="400" font-family="monospace" font-size="56" font-weight="bold" fill="#38bdf8" opacity="0.7">)</text>
</svg>
